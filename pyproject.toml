[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmmp-collector"
version = "1.0.0"
description = "Collecteur de veille TACHFIR sur le Portail Marocain des Marchés Publics (Scrapy, HTTP pur)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
